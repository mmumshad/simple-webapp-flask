apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flask-webapp

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# Change newTag (and newName, if you push to a registry) to roll out a new version
images:
  - name: simple-webapp-flask
    newTag: "1.0.0"
