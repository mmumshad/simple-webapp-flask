apiVersion: v1
kind: Service
metadata:
  name: simple-webapp-flask
  namespace: flask-webapp
  labels:
    app.kubernetes.io/name: simple-webapp-flask
spec:
  # NodePort makes the app reachable from outside the cluster on <any-node-ip>:30080
  type: NodePort
  selector:
    app.kubernetes.io/name: simple-webapp-flask
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
